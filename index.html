<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CnKDataHub | Purchase Data</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <!-- Header Section -->
    <header class="header-section">
        <h1>Welcome to CnKDataHub</h1>
        <p>Purchase your data bundle safely and easily.</p>
    </header>

    <!-- Data Form -->
    <form id="dataForm">
        <label for="network">Network</label>
        <select id="network" name="network" onchange="updateBundles()">
            <option value="MTN">MTN</option>
            <option value="Telecel">Telecel</option>
            <option value="AirtelTigo">AirtelTigo</option>
        </select>

        <label for="bundle">Data</label>
        <select id="bundle" name="bundle">
            <!-- Bundles will be populated automatically by script.js -->
        </select>

        <label for="phone">Data Number</label>
        <input type="tel" id="phone" placeholder="024 XXX XXXX" required>

        <label for="reference">MoMo Number</label>
        <input type="text" id="reference" placeholder="Enter payment reference" required>

        <button type="submit">Submit Order</button>
    </form>

    <!-- Support Section -->
    <div class="support-section">
        <p style="margin-bottom: 10px; font-size: 0.8rem; color: #666;">Need assistance?</p>
        <a href="https://wa.me/233537638549" target="_blank" class="whatsapp-btn">
            Chat on WhatsApp
        </a>
    </div>

    <p id="status"></p>
</div>

<!-- Link to your script -->
<script src="script.js"></script>
</body>
</html>
