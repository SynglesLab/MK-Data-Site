```html
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Buy Mobile Data</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

  <h1>Buy Mobile Data</h1>

  <form id="dataForm">

    <label>Network</label>

    <select id="network">

      <option>MTN</option>

      <option>Telecel</option>

      <option>AirtelTigo</option>

    </select>

    <label>Bundle</label>

    <select id="bundle">

      <option>1GB</option>

      <option>2GB</option>

      <option>5GB</option>

      <option>10GB</option>

    </select>

    <label>Phone Number</label>

    <input
      type="text"
      id="phone"
      placeholder="024XXXXXXX"
      required
    >

    <label>MoMo Reference</label>

    <input
      type="text"
      id="reference"
      placeholder="Enter payment reference"
      required
    >

    <button type="submit">
      Submit Order
    </button>

  </form>

  <p id="status"></p>

</div>

<script src="script.js"></script>

</body>
</html>
```
